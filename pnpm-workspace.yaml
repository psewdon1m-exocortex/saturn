packages:
  - "apps/*"
  - "packages/*"

overrides:
  fastify: 5.12.6
  fast-uri@3: 3.1.9
  fast-uri@4: 4.2.3
  brace-expansion@2: 2.1.7
  dompurify: 3.4.17
  'archiver-utils@5.0.2>glob': 14.0.2
  'readdir-glob@1.1.3>minimatch': 11.0.1
  'glob@14.0.2>minimatch': 11.0.1

allowBuilds:
  cpu-features: false
  esbuild: true
  ffmpeg-static: true
  ssh2: false

catalog:
  "@types/node": 26.3.0
  tsup: 8.5.1
  tsx: 4.23.12
  typescript: 5.9.3
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.5'
  - '@nestjs/core@11.2.5'
  - '@nestjs/platform-fastify@11.2.5'

patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
