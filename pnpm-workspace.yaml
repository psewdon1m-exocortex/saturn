packages:
  - "apps/*"
  - "packages/*"

overrides:
  fastify: 5.12.5
  fast-uri@3: 3.1.8
  fast-uri@4: 4.1.5
  brace-expansion@2: 2.1.7
  dompurify: 3.4.16

allowBuilds:
  cpu-features: false
  esbuild: true
  ffmpeg-static: true
  ssh2: false

catalog:
  "@types/node": 26.3.0
  tsup: 8.5.1
  tsx: 4.23.12
  typescript: 5.9.3
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.5'
  - '@nestjs/core@11.2.5'
  - '@nestjs/platform-fastify@11.2.5'
