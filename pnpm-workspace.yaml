packages:
  - "apps/*"
  - "packages/*"

overrides:
  fastify: 5.12.1

allowBuilds:
  cpu-features: false
  esbuild: true
  ssh2: false

catalog:
  "@types/node": 26.3.0
  tsup: 8.5.1
  tsx: 4.23.12
  typescript: 5.9.3
  vitest: 4.1.11

minimumReleaseAgeExclude:
  - '@nestjs/common@11.2.3'
  - '@nestjs/core@11.2.3'
  - '@nestjs/platform-fastify@11.2.3'
