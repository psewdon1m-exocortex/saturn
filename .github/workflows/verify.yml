name: verify

on:
  workflow_call:
    inputs:
      volt-ref:
        type: string
        default: ''
      mastermind-ref:
        type: string
        default: ''
  pull_request:
  push:
    branches:
      - main
      - "release-qualification/package1-*"
      - "release-qualification/package6-*"
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  consumers:
    name: Qualified Settings consumers
    if: ${{ inputs.volt-ref != '' && inputs.mastermind-ref != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: saturn
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: psewdon1m-exocortex/volt
          ref: ${{ inputs.volt-ref }}
          path: volt
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: psewdon1m-exocortex/mastermind
          ref: ${{ inputs.mastermind-ref }}
          path: mastermind
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - working-directory: saturn
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate && pnpm install --frozen-lockfile
      - name: Test explicit consumer revisions
        working-directory: saturn
        env:
          EXOCORTEX_CONSUMER_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          git -C ../volt rev-parse HEAD
          git -C ../mastermind rev-parse HEAD
          pnpm --filter @saturn/web test:consumers
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools openssl
          pnpm exec playwright install --with-deps chromium
      - name: Verify isolated Stage 13 orchestration controls
        run: node --test --test-concurrency=2 scripts/stage13-*.test.mjs scripts/ci-workspace-*.test.mjs
      - name: Validate the pinned Part 12 catalog and fail-closed gate
        run: |
          python3 scripts/test-known-problems-gate.py
          python3 scripts/known-problems-gate.py --phase structure
      - name: Run production-like verification
        run: pnpm verify:stage:13
      - name: Verify the Storage new interface
        env:
          SATURN_UI_OUTPUT: artifacts/verification/storage-new
        run: pnpm verify:storage-new
      - name: Verify embedded documentation
        env:
          SATURN_DOCUMENTATION_OUTPUT: artifacts/verification/documentation
        run: pnpm verify:documentation
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saturn-verification-${{ github.sha }}
          path: |
            artifacts/verification/
            .release-evidence/
            known-problems-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter @saturn/api... --filter @saturn/protection... build
      - name: Run SQL suites with owned PostgreSQL, SFTP, K4 and dump inputs
        run: node scripts/ci-workspace-inputs.mjs --postgres-suite
      - name: Preserve input closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: saturn-postgres-inputs-${{ github.sha }}
          path: artifacts/verification/workspace-inputs/
          if-no-files-found: ignore
          retention-days: 14

  pre-push-gate:
    name: Pre-push gate
    needs: [verify, postgres]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate seven mandatory areas
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 scripts/pre-push-gate.py
          --upstream-result "${{ needs.verify.result == 'success' && needs.postgres.result == 'success' && 'success' || 'failure' }}"
          --report .pre-push-gate-report.json
      - name: Preserve gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saturn-pre-push-gate-${{ github.sha }}
          path: .pre-push-gate-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
