name: verify

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.24.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production-like verification
        run: pnpm verify:stage:13
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vault-verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: ignore
          retention-days: 14

  pre-push-gate:
    name: Pre-push gate
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate seven mandatory areas
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 scripts/pre-push-gate.py
          --upstream-result "${{ needs.verify.result }}"
          --report .pre-push-gate-report.json
      - name: Preserve gate report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saturn-pre-push-gate-${{ github.sha }}
          path: .pre-push-gate-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
